<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:Hanken;font-weight:600;src:url(hanken-600.woff2)}
@font-face{font-family:Poppins;font-weight:400;src:url(poppins-400.woff2)}
@font-face{font-family:Poppins;font-weight:500;src:url(poppins-500.woff2)}
*{margin:0;box-sizing:border-box}
body{width:1600px;height:1000px;display:grid;grid-template-columns:1fr 1fr;position:relative;overflow:hidden;font-family:Poppins}
.half{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:44px;position:relative}
.left{background:#ffffff;padding-right:70px}
.right{background:#1d3b2a;color:#fdfbf5;padding-left:70px}
.pe{width:450px;height:auto}
.el{display:flex;align-items:center;gap:22px}
.el svg{width:112px;height:auto;color:#fdfbf5}
.el span{font-family:Hanken;font-weight:600;font-size:70px;letter-spacing:-0.02em;color:#fdfbf5}
.lab{position:absolute;bottom:64px;left:0;right:0;text-align:center;font-size:22px;letter-spacing:.14em;text-transform:uppercase;font-weight:500}
.left .lab{color:#5f6b73;padding-right:70px}.right .lab{padding-left:70px}.right .lab{color:rgba(253,251,245,.72)}
.x{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:132px;height:132px;border-radius:50%;background:#f37021;display:grid;place-items:center;box-shadow:0 10px 30px rgba(0,0,0,.18)}
.x svg{width:46px;height:46px}
</style></head><body>
<div class="half left"><img class="pe" src="pe-logo.svg" alt=""><p class="lab">PJM Projekteffektivitet AB</p></div>
<div class="half right"><div class="el"><svg viewBox="0 0 1884.3 1353.9"><path d="M0.0 1353.9 L1218.7 0.0 L1218.7 329.1 L479.7 1136.4 L786.7 1132.4 L1215.5 687.4 L1884.3 1349.9 L1590.1 1349.9 L1218.6 994.7 L865.4 1349.9Z" fill="currentColor"/></svg><span>Elevate Studio</span></div><p class="lab">elevatestudio.nu</p></div>
<div class="x"><svg viewBox="0 0 24 24"><path d="M5 5L19 19M19 5L5 19" stroke="#1d2b36" stroke-width="2.6" stroke-linecap="round"/></svg></div>
</body></html>
