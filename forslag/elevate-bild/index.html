<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Bildförslag – Elevate Studio-nyheten</title>
<style>
  :root { --ink:#1d2b36; --muted:#5f6b73; --bg:#f4f1ea; --card:#fbfaf6; --orange:#f37021; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.6 system-ui, -apple-system, 'Segoe UI', sans-serif; }
  main { max-width: 1200px; margin: 0 auto; padding: 48px clamp(16px, 4vw, 40px) 80px; }
  h1 { font-size: clamp(1.8rem, 1.2rem + 2vw, 2.6rem); line-height:1.15; margin: 0 0 12px; letter-spacing:-0.02em; }
  .intro { color: var(--muted); max-width: 46em; margin: 0 0 40px; }
  .grid { display:grid; gap: 28px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 520px), 1fr)); }
  figure { margin:0; background:var(--card); border-radius:18px; overflow:hidden; }
  figure img { display:block; width:100%; height:auto; }
  figcaption { padding: 18px 22px 22px; }
  figcaption b { display:block; font-size:1.15rem; margin-bottom:4px; }
  figcaption b span { color: var(--orange); margin-right:6px; }
  figcaption p { margin:0; color: var(--muted); font-size: .95rem; }
</style>
</head>
<body>
<main>
  <h1>Fem bildförslag till nyheten om Elevate Studio</h1>
  <p class="intro">Alla förslag visar båda logotyperna och att Projekteffektivitet och Elevate Studio är två varumärken i samma bolag, PJM Projekteffektivitet AB. Formatet är 1600 × 1000 px (16:10), samma som nyhetskorten.</p>
  <div class="grid">
    <figure><img src="elevate-forslag-1.jpg" alt="Förslag 1" width="1600" height="1000"><figcaption><b><span>1</span>Paraply</b><p>PJM Projekteffektivitet AB överst med en linje som grenar ut till de två varumärkena – som ett organisationsschema.</p></figcaption></figure>
    <figure><img src="elevate-forslag-2.jpg" alt="Förslag 2" width="1600" height="1000"><figcaption><b><span>2</span>Diagonal</b><p>Vitt och Elevate-grönt delat på snedden, orange × i mitten och etiketten ”Ett bolag · två varumärken”.</p></figcaption></figure>
    <figure><img src="elevate-forslag-3.jpg" alt="Förslag 3" width="1600" height="1000"><figcaption><b><span>3</span>Ring</b><p>Båda symbolerna inom samma orange ring – ett bolag – med namnen under på mörk bakgrund.</p></figcaption></figure>
    <figure><img src="elevate-forslag-4.jpg" alt="Förslag 4" width="1600" height="1000"><figcaption><b><span>4</span>Visitkort</b><p>Två visitkort på vägfoto med rubriken ”Två varumärken. Ett bolag.”</p></figcaption></figure>
    <figure><img src="elevate-forslag-5.jpg" alt="Förslag 5" width="1600" height="1000"><figcaption><b><span>5</span>Vägen</b><p>Vägfoto med ”Samma väg framåt” och logotyperna i ett ljust fält under, som på webbplatsen.</p></figcaption></figure>
  </div>
</main>
</body>
</html>
