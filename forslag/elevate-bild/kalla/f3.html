<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="base.css"><style>
body{background:radial-gradient(80% 90% at 50% 40%,#1f3341 0%,#14202b 70%);color:var(--cream);display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring{position:relative;width:640px;height:400px;border:3px solid var(--orange);border-radius:999px;display:flex;align-items:center;justify-content:center;gap:56px}
.ring img{width:200px}
.ring .em{width:230px;color:var(--cream)}
.plus{font-size:64px;font-weight:300;color:var(--orange);line-height:1}
.ring .tag{position:absolute;top:-19px;left:50%;transform:translateX(-50%);background:#182834;padding:4px 22px;color:var(--orange);white-space:nowrap}
.names{margin-top:56px;display:flex;align-items:baseline;gap:28px;font-size:46px;font-weight:500;letter-spacing:-0.02em}
.names .amp{color:var(--orange);font-weight:400}
.names .el{font-size:50px}
.sub{margin-top:18px;font-size:24px;color:rgba(253,251,245,.7)}

<div class="names"><span>Projekteffektivitet</span><span class="amp">&amp;</span><span class="el">Elevate Studio</span></div>

</body></html>
