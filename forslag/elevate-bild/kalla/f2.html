<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="base.css"><style>
body{background:#fff}
.g{position:absolute;inset:0;background:var(--green);clip-path:polygon(60% 0,100% 0,100% 100%,40% 100%)}
.pe{position:absolute;left:12%;top:50%;transform:translateY(-62%);width:440px}
.elv{position:absolute;right:9%;top:50%;transform:translateY(-62%);color:var(--cream);font-size:72px}
.x{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);width:120px;height:120px;border-radius:50%;background:var(--orange);display:grid;place-items:center;box-shadow:0 10px 30px rgba(0,0,0,.2)}
.x svg{width:42px}
.band{position:absolute;left:50%;bottom:92px;transform:translateX(-50%);background:#fff;border-radius:999px;padding:20px 40px;display:flex;gap:22px;align-items:center;box-shadow:0 14px 40px rgba(0,0,0,.18);white-space:nowrap;color:var(--navy)}
.band b{font-weight:600;font-size:26px}.band span{font-size:24px;color:#5f6b73}
.dot{width:8px;height:8px;border-radius:50%;background:var(--orange)}

<div class="g"></div>
<img class="pe" src="../../../src/assets/logo/logo.svg" alt="">

<div class="band"><b>Ett bolag</b><i class="dot"></i><span>två varumärken</span><i class="dot"></i><span>PJM Projekteffektivitet AB</span></div>
</body></html>
