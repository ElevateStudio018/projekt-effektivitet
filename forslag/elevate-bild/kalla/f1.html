<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="base.css"><style>
body{background:var(--stone);display:flex;flex-direction:column;align-items:center;justify-content:center;padding-bottom:20px}
.top{text-align:center;color:var(--navy)}
.top .lbl{color:#a14a17;margin-bottom:14px}
.top h1{font-weight:500;font-size:64px;letter-spacing:-0.02em;line-height:1.1}
.top p{color:#5f6b73;font-size:22px;margin-top:8px}
.tree{position:relative;width:860px;height:110px;margin-top:34px}
.tree::before{content:'';position:absolute;left:50%;top:0;width:3px;height:50px;background:var(--orange);transform:translateX(-50%)}
.tree::after{content:'';position:absolute;left:180px;right:180px;top:50px;height:60px;border:3px solid var(--orange);border-bottom:0;border-radius:22px 22px 0 0}
.cards{display:flex;gap:140px}
.card{width:520px;height:330px;border-radius:30px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;box-shadow:0 18px 40px rgba(29,43,54,.12)}
.c1{background:#fff}.c1 img{width:330px}
.c2{background:var(--green);color:var(--cream)}.c2 .el{font-size:58px}
.card p{font-size:19px;letter-spacing:.02em}
.c1 p{color:#5f6b73}.c2 p{color:rgba(253,251,245,.75)}
</style></head><body>
<div class="top"><p class="lbl">Ett bolag · två varumärken</p><h1>PJM Projekteffektivitet AB</h1><p>org.nr 556969-4358</p></div>
<div class="tree"></div>
<div class="cards">
 <div class="card c1"><img src="../../../src/assets/logo/logo.svg" alt=""><p>Projektledning & verksamhetseffekt</p></div>
 <div class="card c2"><span class="el"><svg viewBox="0 0 1884.3 1353.9" aria-hidden="true"><path d="M0.0 1353.9 L1218.7 0.0 L1218.7 329.1 L479.7 1136.4 L786.7 1132.4 L1215.5 687.4 L1884.3 1349.9 L1590.1 1349.9 L1218.6 994.7 L865.4 1349.9Z" fill="currentColor"/></svg> Elevate Studio</span><p>Webbyrå · hemsidor som ger förfrågningar</p></div>
</div>
</body></html>
